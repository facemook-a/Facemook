plugins { id 'com.android.application' }

android {
    namespace 'com.morocco.appfactory'
    compileSdk 34
    defaultConfig {
        applicationId 'com.morocco.appfactory'
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            systemProperty 'mf.fixtureDir', layout.buildDirectory.dir('export-fixtures').get().asFile.absolutePath
            systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
            // Forked test VMs need the same supported proxy/CA settings as Gradle.
            ['http.proxyHost', 'http.proxyPort', 'https.proxyHost', 'https.proxyPort',
             'javax.net.ssl.trustStore'].each { key ->
                if (System.getProperty(key)) systemProperty key, System.getProperty(key)
            }
            if (System.getProperty('https.proxyHost')) {
                systemProperty 'robolectric.dependency.proxy.host', System.getProperty('https.proxyHost')
                systemProperty 'robolectric.dependency.proxy.port', System.getProperty('https.proxyPort', '8080')
            }
        }
    }
    buildTypes { release { minifyEnabled false } }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'com.google.android.gms:play-services-ads:22.0.0'
    implementation 'com.google.android.gms:play-services-auth:20.7.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20231013'
    testImplementation 'org.robolectric:robolectric:4.12.2'
}
