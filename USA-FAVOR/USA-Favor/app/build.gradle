plugins { id 'com.android.application' }
android { namespace 'com.usa.user'; compileSdk 35
 defaultConfig { applicationId 'com.usa.user'; minSdk 26; targetSdk 35; versionCode 1; versionName '1.0.0' }
 testOptions { unitTests.includeAndroidResources = true; unitTests.all { systemProperty "robolectric.dependency.repo.url", "https://repo.maven.apache.org/maven2"; ["http.proxyHost","http.proxyPort","https.proxyHost","https.proxyPort","javax.net.ssl.trustStore"].each { k -> if (System.getProperty(k) != null) systemProperty k, System.getProperty(k) } } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 buildTypes { release { minifyEnabled false } }
 packaging { jniLibs { useLegacyPackaging = true } }
}
dependencies { implementation platform('com.google.firebase:firebase-bom:33.7.0'); implementation 'com.google.firebase:firebase-auth'; implementation 'com.google.firebase:firebase-database'; testImplementation 'junit:junit:4.13.2'; testImplementation 'org.robolectric:robolectric:4.14.1'
implementation project(':openvpn')
}
